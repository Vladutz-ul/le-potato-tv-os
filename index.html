<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Smart TV OS</h1>
        <div class="status-bar">
            <span class="temp" id="board-temp">--°C</span>
            <span class="wifi">📶</span>
            <span class="time" id="clock">00:00</span>
        </div>
    </div>
    
    <div class="app-grid">
        <div class="app active">Browser</div>
        <div class="app">YouTube</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
